name: Release

on:
  push:
    tags: ['v*.*.*']

# Nothing is granted by default; each job takes only what it needs.
permissions: {}

env:
  LIBDAISY_REF: cc146d5065dd8286078a662e2830bf820c37a612
  # The toolchain a release is built with. test/size_budget.txt is measured
  # with it, and the release notes name it.
  RELEASE_GCC: '15.3.Rel1'

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag, the version header and the changelog must agree
        id: check
        run: python3 scripts/verify-release.py "$GITHUB_REF_NAME"

  tests:
    name: Suites
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  package:
    name: Build and attest the artifacts
    needs: [verify, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # to mint the OIDC token Sigstore signs against
      attestations: write    # to persist the attestation
      artifact-metadata: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout libDaisy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: electro-smith/libDaisy
          ref: ${{ env.LIBDAISY_REF }}
          path: libDaisy
          submodules: recursive
          persist-credentials: false

      - name: Set up ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: ${{ env.RELEASE_GCC }}

      - name: Build libDaisy
        run: make -C libDaisy -j -s

      - name: Build the example
        run: make -C examples/seed -s LIBDAISY_DIR="$PWD/libDaisy"

      - name: The published tag, as a submodule consumer
        # Not the working tree: the fixture clones the tag, so this is the
        # integration a user gets by following the README against this release.
        run: LIBDAISY_DIR="$PWD/libDaisy" bash test/consumer.sh "$GITHUB_REF_NAME"

      - name: Flash and RAM against the budget
        run: LIBDAISY_DIR="$PWD/libDaisy" bash test/size.sh

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir dist
          prefix="cloudseed-daisy-$VERSION"

          # From the tag's tree, so nothing of the runner's workspace is in it.
          # git archive takes its timestamps from the commit and gzip -n
          # records none, so the same tag always gives the same bytes.
          git archive --format=tar --prefix="$prefix/" "$GITHUB_SHA" \
            | gzip -n > "dist/$prefix.tar.gz"

          cp examples/seed/build/cloudseed-daisy-example.bin \
             "dist/cloudseed-daisy-example-$VERSION.bin"

          bash scripts/release-notices.sh "$PWD/libDaisy" \
            "$(dirname "$(command -v arm-none-eabi-gcc)")/../license.txt" \
            > dist/THIRD-PARTY-NOTICES.txt

          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Upload the artifacts to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the only job that can write to the repository
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.VERSION }}
          path: dist

      - name: Write the preamble
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Cloud Seed for the Daisy Seed, version $VERSION.

          Add it to a libDaisy project:

          \`\`\`sh
          git submodule add https://github.com/benjaminvdb/cloudseed-daisy lib/cloudseed-daisy
          git -C lib/cloudseed-daisy checkout $GITHUB_REF_NAME
          \`\`\`

          See the [README](https://github.com/benjaminvdb/cloudseed-daisy/blob/$GITHUB_REF_NAME/README.md#-quick-start) for the rest, and the [changelog](https://github.com/benjaminvdb/cloudseed-daisy/blob/$GITHUB_REF_NAME/CHANGELOG.md).

          ### The assets

          | File | What it is |
          |---|---|
          | \`cloudseed-daisy-$VERSION.tar.gz\` | The source, from the tag's tree. |
          | \`cloudseed-daisy-example-$VERSION.bin\` | The bare-Seed example, built with GCC ${RELEASE_GCC}. Flash it with the [Daisy Web Programmer](https://electro-smith.github.io/Programmer/). |
          | \`THIRD-PARTY-NOTICES.txt\` | License notices for the firmware; keep them with the image when redistributing it. |
          | \`SHA256SUMS\` | Checksums of the source, firmware and notices. |

          Every asset carries a signed build attestation:

          \`\`\`sh
          sha256sum --check SHA256SUMS
          gh attestation verify cloudseed-daisy-example-$VERSION.bin --repo $GITHUB_REPOSITORY
          \`\`\`

          ---
          NOTES

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            --draft
          echo "::notice::Draft release $GITHUB_REF_NAME is ready. Review it, attach the hardware acceptance record, then publish."
